services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: field_service
      POSTGRES_USER: field_service
      POSTGRES_PASSWORD: field_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_service -d field_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      POSTGRES_DB: field_service
      POSTGRES_USER: field_service
      POSTGRES_PASSWORD: field_service
      DATABASE_URL: postgres://field_service:field_service@postgres:5432/field_service
      API_BIND_ADDR: 0.0.0.0:3000
      APP_ENV: development
      RUST_LOG: field_service_api=debug
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
